<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Sherzodbek Khaydarov — Full-Stack Developer and Data Analyst</title>
<desc id="desc">A refined navy profile banner with teal accents, a concise introduction, and abstract code and data graphics.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#09111f"/>
    <stop offset="56%" stop-color="#101d30"/>
    <stop offset="100%" stop-color="#0b1727"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#2dd4bf"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#1d7890" stop-opacity=".3"/>
    <stop offset="100%" stop-color="#1d7890" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#54708e" stroke-width=".7" opacity=".16"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="300" fill="url(#background)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="1000" cy="150" rx="255" ry="220" fill="url(#glow)"/>
  <rect width="7" height="300" fill="url(#accent)"/>
  <path d="M0 276H1200" stroke="#244057" stroke-width="1" opacity=".55"/>
  <path d="M734 -32C827 36 837 144 949 189S1110 224 1230 138" fill="none" stroke="#1b4054" stroke-width="2" opacity=".6"/>
  <path d="M777 -44C870 32 892 112 984 155S1130 191 1220 114" fill="none" stroke="#244b60" stroke-width="1.5" opacity=".55"/>

  <text x="72" y="66" fill="#67d7e7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3.2">FULL-STACK ENGINEERING  ·  DATA ANALYTICS</text>
  <rect x="72" y="84" width="52" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="70" y="153" fill="#f4f7fb" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.7">Sherzodbek Khaydarov</text>
  <text x="73" y="197" fill="#c0cedd" font-family="Segoe UI, Arial, sans-serif" font-size="19">Clean interfaces. Reliable APIs. Useful insights.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".7">
    <rect x="72" y="222" width="112" height="30" rx="15" fill="#14263a" stroke="#2a5068"/>
    <circle cx="89" cy="237" r="3.5" fill="#38bdf8"/>
    <text x="101" y="241" fill="#c8d8e6">PRODUCTS</text>
    <rect x="195" y="222" width="104" height="30" rx="15" fill="#14263a" stroke="#2a5068"/>
    <circle cx="212" cy="237" r="3.5" fill="#2dd4bf"/>
    <text x="224" y="241" fill="#c8d8e6">BACKEND</text>
    <rect x="310" y="222" width="93" height="30" rx="15" fill="#14263a" stroke="#2a5068"/>
    <circle cx="327" cy="237" r="3.5" fill="#a78bfa"/>
    <text x="339" y="241" fill="#c8d8e6">DATA</text>
  </g>

  <circle cx="1010" cy="150" r="112" fill="none" stroke="#24485c" stroke-width="1.5"/>
  <circle cx="1010" cy="150" r="91" fill="none" stroke="#2c6175" stroke-width="1.4" stroke-dasharray="3 9" opacity=".75"/>
  <circle cx="1010" cy="150" r="68" fill="#10273a" stroke="#35758a" stroke-width="1.5"/>
  <path d="M990 121l-29 29 29 29M1030 121l29 29-29 29M1022 113l-24 74" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1100" cy="78" r="4" fill="#2dd4bf"/>
  <circle cx="918" cy="221" r="3" fill="#38bdf8"/>
  <path d="M916 229h188" stroke="#31566b" stroke-width="1" opacity=".75"/>
  <path d="M930 220v-14M951 220v-24M972 220v-35M993 220v-21M1014 220v-43M1035 220v-29" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity=".65"/>
