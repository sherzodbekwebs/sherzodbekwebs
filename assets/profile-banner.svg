<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Sherzodbek Khaydarov — Full-Stack Developer &amp; Data Analyst</title>
<desc id="desc">A dark navy banner with a clean cyan accent, name, role and geometric code-inspired graphics.</desc>
